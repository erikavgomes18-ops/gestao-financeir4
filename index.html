<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão Financeira</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d1117" />
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2333; --borda:#30363d;
    --azul:#3b82f6; --azul-claro:#60a5fa; --verde:#22c55e; --vermelho:#ef4444;
    --texto:#e6edf3; --suave:#8b949e;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--texto);min-height:100vh;padding-bottom:40px}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda)}
  header .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--azul),#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:1.15rem}
  header p{font-size:.75rem;color:var(--suave)}
  main{max-width:760px;margin:0 auto;padding:20px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px}
  .card span{font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.5px}
  .card strong{display:block;font-size:1.25rem;margin-top:6px}
  .card.saldo strong{color:var(--azul-claro)}
  .card.rec strong{color:var(--verde)}
  .card.desp strong{color:var(--vermelho)}
  section{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:18px;margin-bottom:20px}
  section h2{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .linha{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  label{display:block;font-size:.75rem;color:var(--suave);margin-bottom:5px}
  input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--borda);background:var(--card2);color:var(--texto);font-size:.95rem;outline:none}
  input:focus,select:focus{border-color:var(--azul)}
  .toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
  .toggle button{padding:10px;border:none;background:var(--card2);color:var(--suave);font-weight:600;cursor:pointer;font-size:.9rem}
  .toggle button.ativo-rec{background:var(--verde);color:#fff}
  .toggle button.ativo-desp{background:var(--vermelho);color:#fff}
  button.principal{width:100%;padding:12px;border:none;border-radius:10px;background:var(--azul);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s}
  button.principal:hover{background:#2563eb}
  .mes-barra{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .btn-limpar{padding:8px 14px;border-radius:10px;border:1px solid var(--borda);background:transparent;color:var(--vermelho);cursor:pointer;font-size:.85rem}
  .btn-limpar:hover{background:rgba(239,68,68,.1)}
  .transacao{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--card2);margin-bottom:8px;animation:aparecer .25s ease}
  @keyframes aparecer{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .transacao .info{flex:1;min-width:0}
  .transacao .info b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .transacao .info small{color:var(--suave);font-size:.72rem}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;background:rgba(59,130,246,.15);color:var(--azul-claro);margin-left:6px}
  .valor{font-weight:700;white-space:nowrap}
  .valor.rec{color:var(--verde)} .valor.desp{color:var(--vermelho)}
  .excluir{border:none;background:transparent;color:var(--suave);cursor:pointer;font-size:1rem;padding:6px}
  .excluir:hover{color:var(--vermelho)}
  .barra-cat{margin-bottom:10px}
  .barra-cat .topo{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px}
  .barra-cat .fundo{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
  .barra-cat .preench{height:100%;background:linear-gradient(90deg,var(--azul),var(--azul-claro));border-radius:6px;transition:width .4s}
  .vazio{text-align:center;color:var(--suave);padding:26px 10px;font-size:.9rem}
  @media(max-width:560px){.cards{grid-template-columns:1fr}.linha{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">💰</div>
  <div><h1>Gestão Financeira</h1><p>Controle suas receitas e despesas</p></div>
</header>
<main>
  <div class="cards">
    <div class="card saldo"><span>Saldo total</span><strong id="saldo">R$ 0,00</strong></div>
    <div class="card rec"><span>Receitas</span><strong id="totalRec">R$ 0,00</strong></div>
    <div class="card desp"><span>Despesas</span><strong id="totalDesp">R$ 0,00</strong></div>
  </div>

  <section>
    <h2>➕ Nova transação</h2>
    <div class="linha">
      <div><label>Descrição</label><input id="descricao" placeholder="Ex: Salário, mercado..."/></div>
      <div><label>Valor (R$)</label><input id="valor" inputmode="decimal" placeholder="0,00"/></div>
    </div>
    <div class="linha">
      <div><label>Tipo</label>
        <div class="toggle">
          <button type="button" id="btnRec" class="ativo-rec">Receita</button>
          <button type="button" id="btnDesp">Despesa</button>
        </div>
      </div>
      <div><label>Categoria</label>
        <select id="categoria">
          <option>Salário</option><option>Alimentação</option><option>Transporte</option>
          <option>Moradia</option><option>Lazer</option><option>Saúde</option>
          <option>Educação</option><option>Outros</option>
        </select>
      </div>
    </div>
    <div class="linha">
      <div><label>Data</label><input type="date" id="data"/></div>
      <div style="display:flex;align-items:flex-end"><button class="principal" onclick="adicionar()">Adicionar</button></div>
    </div>
  </section>

  <section>
    <div class="mes-barra">
      <h2 style="margin:0">📋 Transações</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="month" id="mesFiltro"/>
        <button class="btn-limpar" onclick="limparTudo()">Limpar tudo</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>

  <section>
    <h2>📊 Despesas por categoria</h2>
    <div id="grafico"></div>
  </section>
</main>

<script>
let tipoAtual='receita';
const CHAVE='gf_transacoes';
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});

const carregar=()=>JSON.parse(localStorage.getItem(CHAVE)||'[]');
const salvar=t=>localStorage.setItem(CHAVE,JSON.stringify(t));

function parseValor(txt){
  txt=txt.trim().replace('R$','').trim();
  if(txt.includes(',')) txt=txt.replace(/\./g,'').replace(',','.');
  const v=parseFloat(txt);
  return isNaN(v)?null:v;
}

function mesAtual(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function dataHoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function adicionar(){
  const descricao=document.getElementById('descricao').value.trim();
  const valor=parseValor(document.getElementById('valor').value);
  const categoria=document.getElementById('categoria').value;
  const data=document.getElementById('data').value;
  if(!descricao||valor===null||valor<=0||!data){alert('Preencha descrição, valor válido e data.');return;}
  const lista=carregar();
  lista.push({id:Date.now(),descricao,valor,tipo:tipoAtual,categoria,data});
  salvar(lista);
  document.getElementById('descricao').value='';
  document.getElementById('valor').value='';
  renderizar();
}

function excluir(id){
  if(!confirm('Excluir esta transação?'))return;
  salvar(carregar().filter(t=>t.id!==id));
  renderizar();
}

function limparTudo(){
  if(!confirm('Apagar TODAS as transações? Isso não pode ser desfeito.'))return;
  localStorage.removeItem(CHAVE);
  renderizar();
}

function trocarTipo(t){
  tipoAtual=t;
  document.getElementById('btnRec').className=t==='receita'?'ativo-rec':'';
  document.getElementById('btnDesp').className=t==='despesa'?'ativo-desp':'';
}

function renderizar(){
  const mes=document.getElementById('mesFiltro').value||mesAtual();
  const doMes=carregar().filter(t=>t.data&&t.data.startsWith(mes)).sort((a,b)=>b.data.localeCompare(a.data));

  const rec=doMes.filter(t=>t.tipo==='receita').reduce((s,t)=>s+t.valor,0);
  const desp=doMes.filter(t=>t.tipo==='despesa').reduce((s,t)=>s+t.valor,0);
  document.getElementById('saldo').textContent=fmt.format(rec-desp);
  document.getElementById('totalRec').textContent=fmt.format(rec);
  document.getElementById('totalDesp').textContent=fmt.format(desp);

  const lista=document.getElementById('lista');
  if(!doMes.length){
    lista.innerHTML='<div class="vazio">Nenhuma transação registrada neste mês. 📭</div>';
  }else{
    lista.innerHTML=doMes.map(t=>`
      <div class="transacao">
        <div class="info">
          <b>${t.descricao}<span class="tag">${t.categoria}</span></b>
          <small>${t.data.split('-').reverse().join('/')} • ${t.tipo==='receita'?'Receita':'Despesa'}</small>
        </div>
        <span class="valor ${t.tipo}">${t.tipo==='receita'?'+':'-'} ${fmt.format(t.valor)}</span>
        <button class="excluir" onclick="excluir(${t.id})" title="Excluir">🗑️</button>
      </div>`).join('');
  }

  const porCat={};
  doMes.filter(t=>t.tipo==='despesa').forEach(t=>{porCat[t.categoria]=(porCat[t.categoria]||0)+t.valor;});
  const entradas=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const g=document.getElementById('grafico');
  if(!entradas.length){g.innerHTML='<div class="vazio">Sem despesas neste mês.</div>';}
  else{
    const max=entradas[0][1];
    g.innerHTML=entradas.map(([cat,val])=>`
      <div class="barra-cat">
        <div class="topo"><span>${cat}</span><span>${fmt.format(val)}</span></div>
        <div class="fundo"><div class="preench" style="width:${(val/max*100).toFixed(1)}%"></div></div>
      </div>`).join('');
  }
}

document.getElementById('btnRec').onclick=()=>trocarTipo('receita');
document.getElementById('btnDesp').onclick=()=>trocarTipo('despesa');
document.getElementById('mesFiltro').value=mesAtual();
document.getElementById('data').value=dataHoje();
document.getElementById('mesFiltro').addEventListener('change',renderizar);
renderizar();
</script>
</body>
</html>
